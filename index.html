<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B63CE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="电网刷题">
<meta name="description" content="国家电网 832 题 + 南方电网 219 题，双模块独立记录；每题带出处与记忆口诀，左右滑动切题，错题自动归档。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230B63CE'/%3E%3Cpath d='M9 12h14M9 16h14M9 20h9' stroke='%23fff' stroke-width='2.6' stroke-linecap='round'/%3E%3Ccircle cx='24' cy='20' r='2.6' fill='%233FBF7F'/%3E%3C/svg%3E">
<title>电网刷题 · 国网 + 南网</title>
<style>
/* ---------- tokens ---------- */
:root{
  --bg:#F4F5F7; --card:#FFFFFF; --ink:#14171A; --ink2:#3E4650; --muted:#6B7480;
  --line:#E3E6EB; --line2:#EDEFF2;
  --primary:#0B63CE; --primary-ink:#FFFFFF; --primary-tint:#E8F1FD;
  --brand:#00843D;
  --ok:#0E8F62; --ok-tint:#E6F6F0; --ok-line:#9BD9BE;
  --no:#D7263D; --no-tint:#FDEBEE; --no-line:#F3ADB8;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
  --r:14px; --r-sm:10px;
  --fs:16px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
[data-theme="dark"]{
  --bg:#0F1115; --card:#171A20; --ink:#E9ECF1; --ink2:#C3C9D2; --muted:#98A0AC;
  --line:#272C35; --line2:#1F242C;
  --primary:#4C93F5; --primary-ink:#07131F; --primary-tint:#16283F;
  --brand:#3FBF7F;
  --ok:#3FBF8B; --ok-tint:#12291F; --ok-line:#2A6A4F;
  --no:#F0667A; --no-tint:#2C161B; --no-line:#7A3340;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Source Han Sans SC","Noto Sans CJK SC",sans-serif;
  font-size:var(--fs); line-height:1.6;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.hide{display:none!important}

/* ---------- top bar ---------- */
.top{
  position:sticky;top:0;z-index:20;background:var(--bg);
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);
  border-bottom:1px solid var(--line);
}
.top-in{max-width:720px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;min-height:52px}
.brand{display:flex;align-items:center;gap:8px;font-weight:650;letter-spacing:.2px}
.topnav{display:none;gap:2px}
.topnav a{display:flex;align-items:center;height:34px;padding:0 13px;border-radius:9px;text-decoration:none;color:var(--muted);font-size:14px;font-weight:550}
.topnav a:hover{background:var(--line2);color:var(--ink2)}
.topnav a.on{background:var(--primary-tint);color:var(--primary)}
@media (min-width:720px){.topnav{display:flex}}
.dot{width:10px;height:10px;border-radius:3px;background:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}
.spacer{flex:1}
.icon-btn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--ink2)}
.icon-btn:hover{background:var(--line2)}
.icon-btn svg{width:20px;height:20px}

/* ---------- cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:18px}
h1,h2,h3,p{margin:0}
.h-title{font-size:22px;font-weight:700;letter-spacing:-.2px;line-height:1.35}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.sec-title{font-size:13px;font-weight:650;color:var(--muted);letter-spacing:.06em;margin:22px 0 10px}

/* ---------- home stats ---------- */
.hero{padding:20px 18px}
.hero-row{display:flex;gap:8px;margin-top:16px}
.stat{flex:1;min-width:0}
.stat b{display:block;font-size:24px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.stat b .pct{display:inline;font-size:13px;font-weight:600;letter-spacing:0;margin-left:1px}
.stat>span{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.pbar{height:6px;border-radius:99px;background:var(--line2);overflow:hidden;margin-top:16px}
.pbar>i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .3s}

/* ---------- big action ---------- */
.action{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  padding:16px 18px;border-radius:var(--r);background:var(--primary);color:var(--primary-ink);
  font-weight:650;box-shadow:0 2px 10px color-mix(in srgb,var(--primary) 28%,transparent);
  transition:transform .12s,filter .12s;
}
.action:active{transform:scale(.985);filter:brightness(.97)}
.action>span:nth-child(2){min-width:0;flex:1}
.action .a-ico{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
.action .a-ico svg{width:20px;height:20px}
.action small{display:block;font-weight:450;font-size:12px;opacity:.86;margin-top:2px}
.action .a-go{margin-left:auto;opacity:.72}

/* ---------- mode grid ---------- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{
  display:flex;align-items:center;gap:12px;padding:15px 14px;border-radius:var(--r);
  background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);text-align:left;
  transition:border-color .12s,transform .12s;min-width:0;
}
.mode:active{transform:scale(.985)}
.mode:hover{border-color:color-mix(in srgb,var(--primary) 40%,var(--line))}
.mode .m-ico{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--primary-tint);color:var(--primary);flex:none}
.mode .m-ico svg{width:18px;height:18px}
.mode .m-body{min-width:0;flex:1}
.mode .m-t{display:block;font-weight:600;font-size:15px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mode .m-d{display:block;font-size:12px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mode.wide{grid-column:auto}

/* ---------- chapter list ---------- */
.chap{display:flex;align-items:center;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line2);width:100%;text-align:left}
.chap:last-child{border-bottom:0}
.chap .c-name{font-weight:550;font-size:15px;flex:none;min-width:96px}
.chap .c-bar{flex:1;height:5px;border-radius:99px;background:var(--line2);overflow:hidden}
.chap .c-bar>i{display:block;height:100%;background:var(--brand);border-radius:99px}
.chap .c-num{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:56px;text-align:right}

/* ---------- quiz ---------- */
.quizbar{display:flex;align-items:center;gap:10px;padding:9px 16px;max-width:720px;margin:0 auto}
.qidx{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.qbar{flex:1;height:5px;border-radius:99px;background:var(--line);overflow:hidden}
.qbar>i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .25s}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;letter-spacing:.02em}
.tag.t0{background:var(--primary-tint);color:var(--primary)}
.tag.t1{background:#FDF2E3;color:#A96514}
[data-theme="dark"] .tag.t1{background:#2B2113;color:#E0A85B}
.tag.t2{background:var(--ok-tint);color:var(--ok)}
.tag.part{background:var(--line2);color:var(--ink2)}

.qstem{font-size:17px;line-height:1.75;letter-spacing:.01em;margin:14px 0 18px;word-break:break-word}
.qstem em{font-style:normal;color:var(--primary);font-weight:600}

.opts{display:flex;flex-direction:column;gap:9px}
.opt{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  padding:13px 14px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);
  font-size:16px;line-height:1.55;transition:border-color .12s,background .12s,transform .1s;
  min-height:48px;
}
.opt:active{transform:scale(.995)}
.opt .k{
  flex:none;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;
  font-size:12.5px;font-weight:700;background:var(--line2);color:var(--ink2);margin-top:1px;
  transition:background .12s,color .12s;
}
.opt .tx{flex:1;min-width:0;padding-top:1px}
.opt .mk{flex:none;width:20px;height:20px;display:grid;place-items:center;margin-top:2px;opacity:0}
.opt .mk svg{width:19px;height:19px}
.opt.sel{border-color:var(--primary);background:var(--primary-tint)}
.opt.sel .k{background:var(--primary);color:var(--primary-ink)}
.opt.ok{border-color:var(--ok-line);background:var(--ok-tint)}
.opt.ok .k{background:var(--ok);color:#fff}
.opt.ok .mk{opacity:1;color:var(--ok)}
.opt.no{border-color:var(--no-line);background:var(--no-tint)}
.opt.no .k{background:var(--no);color:#fff}
.opt.no .mk{opacity:1;color:var(--no)}
.opt.dim{opacity:.62}
.opt.locked{cursor:default}
.opt.locked:active{transform:none}

/* ---------- explain ---------- */
.exp{
  margin-top:16px;border-radius:var(--r);border:1px solid var(--line);
  background:var(--card);overflow:hidden;
  animation:expIn .22s ease-out both;
}
@keyframes expIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.exp{animation:none}}
.exp-h{display:flex;align-items:center;gap:8px;padding:11px 15px;border-bottom:1px solid var(--line2);font-size:13px;font-weight:650;color:var(--muted);letter-spacing:.04em}
.exp-h .verdict{font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;letter-spacing:.02em}
.verdict.ok{background:var(--ok-tint);color:var(--ok)}
.verdict.no{background:var(--no-tint);color:var(--no)}
.exp-b{padding:14px 15px 15px}
.exp-row{display:flex;gap:10px;font-size:15px;line-height:1.62;padding:5px 0}
.exp-row+.exp-row{border-top:1px dashed var(--line2);margin-top:3px;padding-top:8px}
.exp-k{flex:none;width:38px;color:var(--muted);font-size:12px;font-weight:600;padding-top:3px;letter-spacing:.02em}
.exp-v{flex:1;min-width:0;color:var(--ink2);word-break:break-word}
.exp-v b{color:var(--ink);font-weight:600}
.mn{display:inline-block;background:var(--primary-tint);color:var(--primary);font-weight:650;padding:1px 7px;border-radius:6px;font-size:14px}

/* ---------- footer actions ---------- */
.foot{
  position:sticky;bottom:0;z-index:15;margin-top:20px;
  background:var(--bg);
  background:color-mix(in srgb,var(--bg) 90%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-top:1px solid var(--line);padding:10px 16px calc(10px + var(--safe-b));
}
.foot-in{max-width:720px;margin:0 auto;display:flex;gap:10px}
.btn{
  flex:1;display:flex;align-items:center;justify-content:center;gap:7px;
  min-height:48px;border-radius:12px;font-weight:650;font-size:16px;
  background:var(--line2);color:var(--ink2);transition:filter .12s,transform .1s;
}
.btn:active{transform:scale(.99)}
.btn.primary{background:var(--primary);color:var(--primary-ink);box-shadow:0 2px 8px color-mix(in srgb,var(--primary) 25%,transparent)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink2)}
.btn[disabled]{opacity:.4}
.btn.sm{min-height:40px;font-size:14px;border-radius:10px}
.btn svg{width:18px;height:18px}

/* ---------- wrong list ---------- */
.list-row{display:flex;gap:12px;align-items:flex-start;padding:14px 4px;border-bottom:1px solid var(--line2);width:100%;text-align:left}
.list-row:last-child{border-bottom:0}
.lr-no{flex:none;width:34px;font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.lr-tx{flex:1;min-width:0}
.lr-q{font-size:14.5px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lr-meta{font-size:11.5px;color:var(--muted);margin-top:5px;display:flex;gap:8px;flex-wrap:wrap}
.badge{background:var(--no-tint);color:var(--no);font-weight:650;padding:1px 7px;border-radius:5px}
.badge.g{background:var(--line2);color:var(--ink2)}

/* ---------- empty ---------- */
.empty{text-align:center;padding:56px 20px;color:var(--muted)}
.empty svg{width:44px;height:44px;opacity:.35;margin-bottom:12px}
.empty p{font-size:14.5px;line-height:1.6}

/* ---------- bottom nav ---------- */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;display:none;
  background:var(--card);
  background:color-mix(in srgb,var(--card) 94%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding-bottom:var(--safe-b);
}
.nav-in{max-width:720px;margin:0 auto;display:flex}
.nav a{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px 7px;
  color:var(--muted);text-decoration:none;font-size:10.5px;font-weight:550;
}
.nav a svg{width:21px;height:21px}
.nav a.on{color:var(--primary)}
.nav a.on svg{transform:translateY(-1px)}
@media (max-width:719px){ body.has-nav .nav{display:block} body.has-nav{padding-bottom:calc(58px + var(--safe-b))} }

/* ---------- dialog ---------- */
.mask{position:fixed;inset:0;background:rgba(10,14,20,.42);z-index:60;display:grid;place-items:center;padding:20px;animation:fade .15s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.dlg{background:var(--card);border-radius:16px;max-width:380px;width:100%;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.28);animation:pop .18s ease-out both}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.dlg h3{font-size:17px;margin-bottom:6px}
.dlg p{font-size:14px;color:var(--muted);line-height:1.6}
.dlg-btns{display:flex;gap:10px;margin-top:18px}

/* ---------- result ---------- */
.score{font-size:52px;font-weight:750;letter-spacing:-2px;line-height:1;font-variant-numeric:tabular-nums}
.score.ok{color:var(--ok)} .score.no{color:var(--no)}

/* desktop ---------------------------------------------------- */
@media (min-width:720px){
  .wrap{padding:0 24px}
  .hero{padding:24px}
  .grid{grid-template-columns:1fr 1fr}
  .qstem{font-size:18px}
  body{padding-bottom:24px}
  .foot{position:static;background:none;backdrop-filter:none;border-top:1px solid var(--line);margin-top:26px;padding:14px 0 0;border-top:0}
}
@media (max-width:380px){ .stat b{font-size:21px} .grid{grid-template-columns:1fr} }

/* ---------- 双题库切换条 ---------- */
.banksw{display:flex;gap:8px;margin:0 0 12px}
.banksw button{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;
  padding:9px 8px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--muted);transition:border-color .15s,color .15s,background .15s;
}
.banksw button b{font-size:15px;font-weight:680;letter-spacing:.2px}
.banksw button small{font-size:11px;font-weight:500;opacity:.85;font-variant-numeric:tabular-nums}
.banksw button.on{border-color:var(--brand);color:var(--brand);
  background:color-mix(in srgb,var(--brand) 9%,var(--card));
  box-shadow:0 0 0 1px color-mix(in srgb,var(--brand) 28%,transparent) inset}
.banksw button.on b{color:var(--brand)}
.banksw button:active{transform:scale(.985)}

/* ---------- 左右滑动 ---------- */
.qwrap{will-change:transform;touch-action:pan-y}
.qwrap.sliding{transition:transform .17s ease,opacity .17s ease}
.sw-hint{
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin:16px 0 2px;font-size:12px;color:var(--muted);
  opacity:.85;animation:swhint 2.6s ease-in-out infinite;
}
@keyframes swhint{0%,100%{opacity:.45}50%{opacity:.95}}
@media (prefers-reduced-motion:reduce){.sw-hint{animation:none}}
/* 桌面端提示用语 */
@media (hover:hover) and (pointer:fine){.sw-hint-touch{display:none}}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="brand"><span class="dot"></span><span>电网刷题</span></div>
    <nav class="topnav" id="topnav">
      <a href="#/home" data-r="home">首页</a>
      <a href="#/wrong" data-r="wrong">错题集</a>
      <a href="#/stats" data-r="stats">统计</a>
      <a href="#/more" data-r="more">设置</a>
    </nav>
    <div class="spacer"></div>
    <button class="icon-btn" id="btnTheme" aria-label="切换深浅色" title="切换深浅色"></button>
  </div>
</header>

<main id="app"></main>

<nav class="nav" id="nav">
  <div class="nav-in">
    <a href="#/home" data-r="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.8V21h14V9.8"/></svg>
      <span>首页</span>
    </a>
    <a href="#/wrong" data-r="wrong">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 2.8 19.5h18.4z"/><path d="M12 9.5v4.2"/><path d="M12 16.6v.01"/></svg>
      <span>错题集</span>
    </a>
    <a href="#/stats" data-r="stats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg>
      <span>统计</span>
    </a>
    <a href="#/more" data-r="more">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .32 1.77l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.6 1.6 0 0 0-1.77-.32 1.6 1.6 0 0 0-1 1.47V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.46 1.6 1.6 0 0 0-1.77.32l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.6 1.6 0 0 0 .32-1.77 1.6 1.6 0 0 0-1.47-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.46-1 1.6 1.6 0 0 0-.32-1.77l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.6 1.6 0 0 0 1.77.32H9a1.6 1.6 0 0 0 1-1.47V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.46 1.6 1.6 0 0 0 1.77-.32l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.6 1.6 0 0 0-.32 1.77V9a1.6 1.6 0 0 0 1.47 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.46 1Z"/></svg>
      <span>设置</span>
    </a>

（    ）",["正确","错误"],"A","海外项目把ESG列为实施内容，适应所在国规范并披露，提升竞争力","品牌建设·高频考点","—","海外ESG三件套：治理、实践、披露"],[820,2,4,"企业在自身发展的同时，应当当好“企业公民”，饮水思源，回报社会，这是企业不可推卸的经济责任。（    ）",["正确","错误"],"B","回报社会属社会责任（道德责任），题干却归为“经济责任”，定性错","品牌建设·高频考点","—","回报社会＝社会责任，不是经济责任"],[821,2,4,"可持续发展指的是经济可持续、社会可持续、环境可持续。（    ）",["正确","错误"],"A","可持续讲经济、社会、环境三大支柱，题干三项齐全且缺一不可","品牌建设·高频考点","—","可持续三支柱：经济+社会+环境"],[822,2,4,"积极参与公益慈善事业，是一个企业必须履行的社会责任。（    ）",["正确","错误"],"B","公益慈善是倡导自愿，不是“必须履行”的强制责任，用词过绝对","品牌建设·高频考点","—","公益慈善＝自愿，见“必须”判错"],[823,2,4,"一个企业的能力越大，其所担负的责任就越大。（    ）",["正确","错误"],"B","责任边界由企业角色和影响范围决定，不随“能力大小”无限扩张","品牌建设·高频考点","—","责任有边界，不按能力无限加码"],[824,2,4,"CSR 等同于ESG，二者概念完全一致。（    ）",["正确","错误"],"B","CSR是责任理念，ESG是可量化的披露评价框架，两者不等同","品牌建设·高频考点","—","CSR是理念，ESG是量化披露框架"],[825,2,4,"依法合规诚信经营，遵守法律法规、商业道德、社会公德和行业规则，是企业的底线责任。（    ）",["正确","错误"],"A","依法合规诚信经营就是底线责任，法律、商业道德、行业规则全覆盖","品牌建设·高频考点","—","底线责任＝合法+诚信，守住底线"],[826,2,4,"企业唯一的且仅有的社会责任，就是在遵守社会基本规则的同时，尽可能地赚更多的钱。（    ）",["正确","错误"],"B","“唯一且仅有”把责任窄化成赚钱，甩掉了守法、环保、员工等责任","品牌建设·高频考点","—","见“唯一”“仅有”＝绝对化必错"],[827,2,4,"企业社会责任就是多做好人好事，无私奉献社会，从而提升企业品牌形象。（    ）",["正确","错误"],"B","社会责任不止好人好事，还包括经济、法律、环境等责任，理解片面","品牌建设·高频考点","—","CSR≠好人好事，四层责任都要"],[828,2,4,"企业社会责任报告是企业工作业绩的社会表达，编制发布社会责任报告是履行社会责任的主要表现。（    ）",["正确","错误"],"B","报告只是披露沟通形式，不能等同于“履行社会责任的主要表现”","品牌建设·高频考点","—","报告＝沟通披露，不等于履责本身"],[829,2,4,"企业社会责任是企业的额外负担，并不能为企业高质量发展创造什么价值。（    ）",["正确","错误"],"B","履责能提信誉、降风险、创价值，是投资而非“额外负担”","品牌建设·高频考点","—","CSR是投资不是负担，能创造价值"],[830,2,4,"品牌是创新、质量、服务、信誉的凝结，品牌竞争本质是价值竞争，是高阶竞争。（    ）",["正确","错误"],"A","品牌凝结创新、质量、服务、信誉，本质是价值竞争而非价格战","品牌建设·高频考点","—","品牌四凝结：创新质量服务信誉"],[831,2,4,"网络热点事件能够引起社会极大关注，给自媒体带来较大流量，这种良机不能错过，一定要第一时间转发。（    ）",["正确","错误"],"B","热点不能抢转发，须先核实来源与导向，盲目转发极易传谣","品牌建设·高频考点","—","热点先核实再发声，不抢流量"],[832,2,4,"网络不是法外之地，每个公民都应该遵守网络法律法规，维护网络安全，保护知识产权。（    ）",["正确","错误"],"A","网络不是法外之地，守法、护网络安全、护知识产权是公民义务","品牌建设·高频考点","—","网络非法外之地→守法+护安全"]];

  if(location.hash.replace(/^#\/?/,'')!=='home')history.replaceState(null,'','#/home');
  applyTheme();applyFS();render();
}


/* ---------- state ---------- */
const DEFAULT_PREFS={theme:'auto',fs:2,streakToClear:2,autoNext:false,shuffleOpt:false};
let S=load();

function blank(){return{bank:{},wrong:{},prefs:{...DEFAULT_PREFS},session:null,seen:0};}
function load(){
  try{
    const raw=localStorage.getItem(bankKey());
    if(!raw)return blank();
    const o=JSON.parse(raw);
    return Object.assign(blank(),o,{prefs:Object.assign({...DEFAULT_PREFS},o.prefs||{})});
  }catch(e){return blank();}
}
let memOnly=false;
function save(){
  if(memOnly)return;
  try{localStorage.setItem(bankKey(),JSON.stringify(S));}
  catch(e){memOnly=true;}
}

const $$=(s,r=document)=>[...r.querySelectorAll(s)];

const Q=n=>DB().qs.find(q=>q[0]===n);
const byPart=p=>DB().qs.filter(q=>q[2]===p);
const isMulti=q=>q[1]===1;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
function answeredNo(){return Object.keys(S.bank).length;}
function wrongList(){return Object.keys(S.wrong).map(Number).sort((a,b)=>a-b);}
function correctCount(){return Object.values(S.bank).filter(v=>v.r===1).length;}

/* ---------- theme ---------- */
function applyTheme(){
  const t=S.prefs.theme;
  const dark=t==='dark'||(t==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches);
  document.documentElement.dataset.theme=dark?'dark':'light';

  const m=document.querySelector('meta[name=theme-color]');
  if(m)m.setAttribute('content',dark?'#0F1115':'#F4F5F7');

function applyFS(){
  const sizes=[15,16,17.5];
  document.documentElement.style.setProperty('--fs',sizes[(S.prefs.fs||2)-1]+'px');
}

function parseHash(){

}

/* ============================================================
   QUIZ
   ============================================================ */
let QS=null; // {ids:[],idx,label,sel:{no:[keys]},done:{no:bool},correct:{no:bool}}

function startSession(mode,arg,silent){
  let ids=[],label='';
  if(mode==='seq'){
    ids=DB().qs.map(q=>q[0]);
    // jump to first unanswered
    const first=ids.findIndex(n=>!S.bank[n]);
    const start=first<0?0:first;
    label='顺序练习';
    QS={mode,ids,idx:start,label,sel:{},done:{},correct:{},startedAt:Date.now()};
  }else if(mode==='rand'){
    ids=shuffle(DB().qs.map(q=>q[0]));label='随机练习';
    QS={mode,ids,idx:0,label,sel:{},done:{},correct:{},startedAt:Date.now()};
  }else if(mode==='exam'){
    ids=shuffle(DB().qs.map(q=>q[0])).slice(0,100);label='模拟测试';
    QS={mode,ids,idx:0,label,sel:{},done:{},correct:{},startedAt:Date.now()};
  }else if(mode==='part'){
    ids=byPart(arg).map(q=>q[0]);label=P()[arg];
    QS={mode,ids,idx:0,label,part:arg,sel:{},done:{},correct:{},startedAt:Date.now()};
  }else if(mode==='wrong'){
    ids=wrongList();label='错题重刷';
    if(!ids.length)return;
    QS={mode,ids,idx:0,label,sel:{},done:{},correct:{},startedAt:Date.now()};
  }else if(mode==='single'){
    ids=[arg];label='单题';
    QS={mode,ids,idx:0,label,sel:{},done:{},correct:{},startedAt:Date.now()};
  }
  S.session={mode:QS.mode,ids:QS.ids,idx:QS.idx,label,part:QS.part,at:Date.now()};
  save();
  if(!silent)go('#/quiz');
}

function resumeSession(){
  const s=S.session;
  if(!s||!s.ids||!s.ids.length){startSession('seq');return;}
  QS={mode:s.mode,ids:s.ids,idx:Math.min(s.idx||0,s.ids.length-1),label:s.label||'练习',part:s.part,sel:{},done:{},correct:{},startedAt:Date.now()};
  // preload recorded results so revisited questions show state
  go('#/quiz');
}

function viewQuiz(){
  if(!QS){
    const s=S.session;
    if(s&&s.ids&&s.ids.length){
      QS={mode:s.mode,ids:s.ids,idx:Math.min(s.idx||0,s.ids.length-1),label:s.label||'练习',part:s.part,sel:{},done:{},correct:{},startedAt:Date.now()};
    }else{
      startSession('seq',null,true);
      if(!QS)return;
    }
  }
  renderQuiz();
}

function renderQuiz(){
  const q=Q(QS.ids[QS.idx]);
  const no=q[0];
  const sel=QS.sel[no]||[];
  const done=!!QS.done[no];
  const ans=q[5].split('');
  const right=done&&QS.correct[no];

  const head=`
  <div class="top"><div class="top-in">
    <button class="icon-btn" id="qExit" aria-label="退出">${I.back}</button>
    <div class="spacer"></div>
    <span class="qidx">${QS.idx+1} / ${QS.ids.length}</span>
    <div class="spacer"></div>
    <span class="qidx" style="font-weight:650;color:var(--ink)">${QS.label}</span>
  </div>
  <div class="quizbar"><span class="qidx">${Math.round((QS.idx)/QS.ids.length*100)}%</span><div class="qbar"><i style="width:${((QS.idx+(done?1:0))/QS.ids.length*100).toFixed(1)}%"></i></div><span class="qidx">对 ${Object.values(QS.correct).filter(Boolean).length}</span></div>
  </div>`;

  const opts=q[4].map((t,i)=>{
    const k=String.fromCharCode(65+i);
    let cls='opt';
    if(done){
      cls+=' locked';
      if(ans.includes(k))cls+=' ok';
      else if(sel.includes(k))cls+=' no';
      else cls+=' dim';
    }else if(sel.includes(k))cls+=' sel';
    const mk=done&&ans.includes(k)?I.check:(done&&sel.includes(k)?I.cross:'');
    return `<button class="${cls}" data-k="${k}" ${done?'disabled':''}>
      <span class="k">${k}</span><span class="tx">${esc(t)}</span><span class="mk">${mk}</span></button>`;
  }).join('');

  const expHtml=done?explainHTML(q,sel,right):'';

  const isLast=QS.idx>=QS.ids.length-1;
  const canSubmit=isMulti(q)&&sel.length>0&&!done;
  const foot=`
  <div class="foot"><div class="foot-in">
    <button class="btn ghost" id="qPrev" style="flex:0 0 92px" ${QS.idx===0?'disabled':''}>上一题</button>
    ${done
      ? `<button class="btn primary" id="qNext">${isLast?'查看结果':'下一题'} ${I.next}</button>`
      : isMulti(q)
        ? `<button class="btn primary" id="qSubmit" ${canSubmit?'':'disabled'}>确认答案${sel.length?`（已选 ${sel.length}）`:''}</button>`
        : `<button class="btn ghost" id="qSkip" ${isLast?'disabled':''}>跳过</button>`}
  </div></div>`;

  document.body.classList.remove('has-nav');
  const gh=document.querySelector('header.top'); if(gh)gh.style.display='none';
  $('#app').innerHTML=head+`
  <div class="qwrap"><div class="wrap"><div style="padding-top:14px">
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      <span class="tag t${q[1]}">${TYPES[q[1]]}</span>
      <span class="tag part">${P()[q[2]]}</span>
      <span class="tag part" style="background:transparent;border:1px solid var(--line);color:var(--muted)">第 ${no} 题</span>
    </div>
    <div class="qstem">${stemHTML(q[3])}</div>
    ${(()=>{try{return localStorage.getItem('eb_swipe_hint')?'':'<div class="sw-hint" id="swHint"><span>←</span><span>左右滑动切题</span><span>→</span></div>';}catch(e){return '';}})()}
    <div class="opts">${opts}</div>
    ${expHtml}
    <div style="height:12px"></div>
  </div></div></div>`+foot;

  setNav('');
  bindQuiz(q);
  applyTheme();applyFS();
  window.scrollTo({top:0,behavior:'instant'});
}

function stemHTML(s){
  // underline the blank marker for readability
  return esc(s).replace(/（\s*）/g,'<em>（　）</em>').replace(/\(\s*\)/g,'<em>( )</em>');
}

function explainHTML(q,sel,right){
  const ans=q[5].split('').join('、');
  const picked=sel.length?sel.join('、'):'未选';
  return `<div class="exp">
    <div class="exp-h">
      <span class="verdict ${right?'ok':'no'}">${right?'回答正确':'回答错误'}</span>
      正确答案 <b style="color:var(--${right?'ok':'no'})">${ans}</b>
      ${right?'':`<span style="color:var(--muted);font-weight:400">· 你选了 ${picked}</span>`}
    </div>
    <div class="exp-b">
      <div class="exp-row"><span class="exp-k">为什么</span><span class="exp-v">${esc(q[6]||'—')}</span></div>
      <div class="exp-row"><span class="exp-k">出处</span><span class="exp-v"><b>${esc(q[7]||'—')}</b>${q[8]&&q[8]!=='—'?`　<span style="color:var(--muted)">${esc(q[8])}</span>`:''}</span></div>
      ${q[9]?`<div class="exp-row"><span class="exp-k">口诀</span><span class="exp-v"><span class="mn">${esc(q[9])}</span></span></div>`:''}
    </div>
  </div>`;
}

function bindQuiz(q){
  const no=q[0];
  $('#qExit').onclick=()=>{ if(confirmLeave())go('#/home'); };
  $$('.opt').forEach(b=>{
    b.onclick=()=>{
      if(QS.done[no])return;
      const k=b.dataset.k;
      if(isMulti(q)){
        const cur=new Set(QS.sel[no]||[]);
        cur.has(k)?cur.delete(k):cur.add(k);
        QS.sel[no]=[...cur].sort();
        renderQuiz();
      }else{
        QS.sel[no]=[k];
        judge(q,[k]);
      }
      if(navigator.vibrate)navigator.vibrate(6);
    };
  });
  const sub=$('#qSubmit');
  if(sub)sub.onclick=()=>judge(q,QS.sel[no]||[]);
  const skip=$('#qSkip');
  if(skip)skip.onclick=()=>nextQ();
  const prev=$('#qPrev');
  if(prev)prev.onclick=()=>{if(QS.idx>0){QS.idx--;syncSession();renderQuiz();}};
  const nxt=$('#qNext');
  if(nxt)nxt.onclick=()=>{ if(QS.idx>=QS.ids.length-1)viewResult(); else nextQ(); };
}

function judge(q,sel){
  const no=q[0];
  const ans=q[5].split('').sort().join('');
  const got=sel.slice().sort().join('');
  const right=ans===got;
  QS.done[no]=true;QS.correct[no]=right;

  // bank / wrong book
  S.bank[no]={r:right?1:0,ts:Date.now()};
  if(right){
    if(S.wrong[no]){
      S.wrong[no].streak=(S.wrong[no].streak||0)+1;
      if(S.wrong[no].streak>=S.prefs.streakToClear)delete S.wrong[no];
      else S.wrong[no].ts=Date.now();
    }
  }else{
    S.wrong[no]=S.wrong[no]||{n:0,streak:0};
    S.wrong[no].n=(S.wrong[no].n||0)+1;
    S.wrong[no].streak=0;
    S.wrong[no].ts=Date.now();
  }
  syncSession();save();
  renderQuiz();
  revealExp();
  if(navigator.vibrate)navigator.vibrate(right?8:[10,40,10]);
}

/* 解析出现后，如果它在屏幕外就轻轻滚过来 */
function revealExp(){
  requestAnimationFrame(()=>{
    const e=document.querySelector('.exp');
    if(!e)return;
    const r=e.getBoundingClientRect();
    if(r.top>innerHeight-90){
      const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
      e.scrollIntoView({behavior:reduce?'auto':'smooth',block:'center'});
    }
  });
}

function nextQ(){
  if(QS.idx>=QS.ids.length-1){viewResult();return;}
  QS.idx++;syncSession();save();renderQuiz();
}
function syncSession(){
  S.session={mode:QS.mode,ids:QS.ids,idx:QS.idx,label:QS.label,part:QS.part,at:Date.now()};
}
function confirmLeave(){
  return true;
}

/* ---------- result ---------- */
function viewResult(){
  const n=QS.ids.length;
  const doneN=Object.keys(QS.done).length;
  const rightN=Object.values(QS.correct).filter(Boolean).length;
  const wrongN=doneN-rightN;
  const rate=doneN?Math.round(rightN/doneN*100):0;
  document.body.classList.remove('has-nav');
  const gh=document.querySelector('header.top'); if(gh)gh.style.display='';
  $('#app').innerHTML=`
  <div class="wrap" style="padding-top:28px">
    <div class="card pad" style="text-align:center;padding:26px 20px">
      <div class="sub" style="margin-bottom:10px">${QS.label}</div>
      <div class="score ${rate>=60?'ok':'no'}">${rate}<span style="font-size:22px">%</span></div>
      <div class="hero-row" style="margin-top:20px">
        <div class="stat"><b>${doneN}</b><span>已答</span></div>
        <div class="stat"><b style="color:var(--ok)">${rightN}</b><span>正确</span></div>
        <div class="stat"><b style="color:var(--no)">${wrongN}</b><span>错误</span></div>
      </div>
    </div>
    <div style="height:14px"></div>
    <div class="foot-in" style="flex-direction:column;gap:10px">
      ${wrongN?`<button class="btn primary" id="rWrong" style="width:100%">立即重刷这 ${wrongN} 道错题</button>`:''}
      <button class="btn ${wrongN?'ghost':'primary'}" id="rAgain" style="width:100%">再来一组</button>
      <button class="btn ghost" id="rHome" style="width:100%">回首页</button>
    </div>
  </div>`;
  setNav('');
  $('#rHome').onclick=()=>go('#/home');
  $('#rAgain').onclick=()=>{
    if(QS.mode==='wrong'||wrongList().length===0){go('#/home');return;}
    const again=QS.ids.filter(n=>!QS.correct[n]);
    if(again.length){QS={...QS,ids:again,idx:0,sel:{},done:{},correct:{}};syncSession();go('#/quiz');}
    else go('#/home');
  };
  const rw=$('#rWrong');
  if(rw)rw.onclick=()=>{
    const ids=QS.ids.filter(n=>QS.done[n]&&!QS.correct[n]);
    if(!ids.length)return;
    QS={mode:'retry',ids,idx:0,label:'错题重刷',sel:{},done:{},correct:{},startedAt:Date.now()};
    syncSession();go('#/quiz');
  };
  applyTheme();
}

/* ============================================================
   WRONG BOOK
   ============================================================ */
function viewWrong(){
  const ids=wrongList();
  const rows=ids.map(n=>{
    const q=Q(n),w=S.wrong[n];
    return `<div class="list-row" data-no="${n}">
      <span class="lr-no">${n}</span>
      <span class="lr-tx">
        <span class="lr-q">${esc(q[3].replace(/（\s*）/g,'（　）'))}</span>
        <span class="lr-meta"><span class="badge">错 ${w.n||1} 次</span><span class="badge g">${P()[q[2]]}</span><span class="badge g">${TYPES[q[1]]}</span>${w.streak?`<span class="badge g">答对 ${w.streak}/${S.prefs.streakToClear}</span>`:''}</span>
      </span>
      <span style="flex:none;color:var(--muted);padding-top:2px">${I.next}</span>
    </div>`;
  }).join('');

  shell(`<div class="wrap" style="padding-top:16px">
    <h1 class="h-title">错题集</h1>
    <div class="sub">共 ${ids.length} 道 · 答对 ${S.prefs.streakToClear} 次自动移出，也可手动删</div>
    ${ids.length?`
      <div style="display:flex;gap:10px;margin-top:16px">
        <button class="btn primary" id="wAll" style="flex:2">${I.play} 全部重刷</button>
        <button class="btn ghost" id="wClear" style="flex:1">清空</button>
      </div>
      <div class="sec-title">错题清单（按题号）</div>
      <div class="card pad" style="padding:2px 16px">${rows}</div>
    `:`
      <div class="card" style="margin-top:16px"><div class="empty">${I.check}<p>还没有错题。<br>做错的题会自动收进来，答对 ${S.prefs.streakToClear} 次就移出。</p></div></div>
    `}
    <div style="height:8px"></div>
  </div>`,{nav:'wrong'});

  if(ids.length){
    $('#wAll').onclick=()=>startSession('wrong');
    $('#wClear').onclick=()=>dialog('清空错题集？','会删除全部错题记录，但保留做题统计。','清空',()=>{S.wrong={};save();render();});
    $$('.list-row').forEach(r=>r.onclick=()=>startSession('single',+r.dataset.no));
  }
}

/* ============================================================
   STATS
   ============================================================ */
function viewStats(){
  const total=DB().qs.length,done=answeredNo(),right=correctCount();
  const rate=done?Math.round(right/done*100):0;
  const rows=P().map((p,i)=>{
    const all=byPart(i),d=all.filter(q=>S.bank[q[0]]).length;
    const r=all.filter(q=>S.bank[q[0]]&&S.bank[q[0]].r===1).length;
    const pc=d?Math.round(d/all.length*100):0;
    const acc=d?Math.round(r/d*100):0;
    return `<div style="padding:12px 0;border-bottom:1px solid var(--line2)">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:7px">
        <span style="font-weight:600;font-size:15px">${p}</span>
        <span class="spacer" style="flex:1"></span>
        <span style="font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums">${d}/${all.length} · 正确率 ${d?acc+'%':'—'}</span>
      </div>
      <div class="pbar" style="margin:0"><i style="width:${pc}%;background:var(--brand)"></i></div>
    </div>`;
  }).join('');

  const t=(DB().meta||{}).updated||'';
  shell(`<div class="wrap" style="padding-top:16px">
    <h1 class="h-title">统计</h1>
    <div class="sub">${t?`题库更新 ${t}`:'本机记录，不上传'}</div>
    <div class="card pad" style="margin-top:16px">
      <div class="hero-row" style="margin-top:0">
        <div class="stat"><b>${done}</b><span>已做 / ${total}</span></div>
        <div class="stat"><b>${rate}<span style="font-size:13px">%</span></b><span>正确率</span></div>
        <div class="stat"><b style="color:var(--no)">${wrongList().length}</b><span>错题</span></div>
      </div>
      <div class="pbar"><i style="width:${Math.round(done/total*100)}%"></i></div>
    </div>
    <div class="sec-title">各部分进度</div>
    <div class="card pad" style="padding:4px 18px 14px">${rows}</div>
    <div class="sec-title">本机数据</div>
    <div class="card pad">
      <div style="font-size:13.5px;color:var(--muted);line-height:1.7">
        记录存在这台设备的浏览器里（localStorage），不上传、不联网。换手机或清浏览器数据会丢，建议定期导出备份。
      </div>
      <div style="display:flex;gap:10px;margin-top:14px">
        <button class="btn sm" id="sExport" style="flex:1">${I.down} 导出</button>
        <button class="btn sm" id="sImport" style="flex:1">${I.up} 导入</button>
      </div>
      <input type="file" id="fImport" accept=".json,application/json" class="hide">
    </div>
    <div style="height:8px"></div>
  </div>`,{nav:'stats'});

  $('#sExport').onclick=()=>{
    const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`${DB().name}刷题记录-${new Date().toISOString().slice(0,10)}.json`;
    a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  };
  $('#sImport').onclick=()=>$('#fImport').click();
  $('#fImport').onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{
      try{
        const o=JSON.parse(rd.result);
        if(!o||typeof o!=='object')throw 0;
        S=Object.assign(blank(),o,{prefs:Object.assign({...DEFAULT_PREFS},o.prefs||{})});
        save();render();
      }catch(err){dialog('导入失败','文件格式不对，请选本工具导出的 JSON。');}
    };
    rd.readAsText(f);
  };
}

    <div class="sub">都只有本机生效</div>

    <div class="sec-title">外观</div>

    <div class="sec-title">关于</div>
    <div class="card pad" style="font-size:13.5px;color:var(--muted);line-height:1.75">
      <p>当前模块：<b>${DB().name}</b> · ${DB().sub}，共 ${DB().qs.length} 题。切换模块在首页顶部，两个题库的做题记录、错题集各自独立保存。</p>
      <p style="margin-top:8px">题库来源：${DB().name === '南方电网' ? '《南方电网企业文化及综合知识汇总题库（2026 年 11 月）》' : '《国家电网有限公司高校毕业生招聘考试 · 公共与行业知识题库（2027 版）》'}。</p>
      <p style="margin-top:8px">解析为应试辅助，出处与时间以官方文件为准；遇到与教材不符，以教材和原文件为准。</p>
      <p style="margin-top:8px">快捷键：1-4 选项 · Enter 下一题 · ← → 上/下一题。<br>手机/触屏：<b>左右滑动</b>切题。</p>
      <p style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:12.5px">
        <b style="color:var(--ink2)">使用声明：</b>本题库仅供个人学习备考使用，非国家电网官方资料，
        请勿用于商业用途或对外传播；如涉版权问题，请联系删除。
      </p>
    </div>
    <div style="height:8px"></div>
  </div>`,{nav:'more'});

  $$('#segTheme button').forEach(b=>b.onclick=()=>{S.prefs.theme=b.dataset.t;save();applyTheme();viewMore();});
  $$('#segFS button').forEach(b=>b.onclick=()=>{S.prefs.fs=+b.dataset.f;save();applyFS();viewMore();});
  $$('#segStreak button').forEach(b=>b.onclick=()=>{S.prefs.streakToClear=+b.dataset.s;save();viewMore();});
  $('#mReset').onclick=()=>dialog('清空全部进度？','做题记录、错题集、进度都会删除，无法恢复。','清空',()=>{
    const prefs=S.prefs;S=blank();S.prefs=prefs;save();go('#/home');
  });
}


/* ============================================================
   模块切换 + 左右滑动切题
   ============================================================ */
function bindBanks(){
  document.addEventListener('click',e=>{
    const b=e.target.closest('[data-bank]');
    if(b)switchBank(b.dataset.bank);
  });
}

function swipeEnabled(){return route==='quiz'&&QS&&QS.ids&&QS.ids.length>0;}

function afterSwipe(dir){
  // dir: 1 = 下一题（左滑），-1 = 上一题（右滑）
  if(dir>0){
    if(QS.idx>=QS.ids.length-1){viewResult();return;}
    nextQ();
  }else{
    if(QS.idx<=0)return;
    QS.idx--;syncSession();renderQuiz();
  }
}

function slideOut(dir,done){
  const el=document.querySelector('#app .qwrap');
  if(!el||matchMedia('(prefers-reduced-motion:reduce)').matches){done();return;}
  el.classList.add('sliding');
  el.style.transform=`translateX(${dir>0?-100:100}%)`;
  el.style.opacity='0';
  setTimeout(done,170);
}

function bindSwipe(){
  const app=document.getElementById('app');
  let sx=0,sy=0,dx=0,active=false,moved=false,lock=false,justSwiped=false;

  const reset=()=>{active=false;moved=false;dx=0;};

  app.addEventListener('pointerdown',e=>{
    if(!swipeEnabled()||lock)return;
    if(e.pointerType==='mouse'&&e.button!==0)return;
    active=true;moved=false;dx=0;sx=e.clientX;sy=e.clientY;
  },{passive:true});

  app.addEventListener('pointermove',e=>{
    if(!active)return;
    const mx=e.clientX-sx,my=e.clientY-sy;
    if(Math.abs(mx)<=Math.abs(my)*1.15||Math.abs(my)>34&&!moved)return; // 竖向滚动优先
    if(Math.abs(mx)>10){moved=true;dx=mx;
      const el=app.querySelector('.qwrap');
      if(el){el.style.transition='none';el.style.transform=`translateX(${Math.max(-140,Math.min(140,mx*0.45))}px)`;}
    }
  },{passive:true});

  const finish=()=>{
    if(!active)return;
    const d=dx, mv=moved;
    reset();
    const el=app.querySelector('.qwrap');
    if(!mv||Math.abs(d)<64){
      if(el){el.style.transition='transform .16s ease';el.style.transform='translateX(0)';}
      return;
    }
    justSwiped=true;setTimeout(()=>{justSwiped=false;},450);
    lock=true;
    try{localStorage.setItem('eb_swipe_hint','1');}catch(e){}
    const hint=document.getElementById('swHint');if(hint)hint.remove();
    const dir=d<0?1:-1;
    if(dir<0&&QS.idx<=0){ // 第一题右滑：回弹
      if(el){el.style.transition='transform .16s ease';el.style.transform='translateX(0)';}
      lock=false;return;
    }
    slideOut(dir,()=>{
      afterSwipe(dir);
      lock=false;
      if(navigator.vibrate)navigator.vibrate(6);
    });
  };

  app.addEventListener('pointerup',finish);
  app.addEventListener('pointercancel',()=>{
    reset();
    const el=app.querySelector('.qwrap');
    if(el){el.style.transition='transform .16s ease';el.style.transform='translateX(0)';}
  });

  // 滑动之后吞掉随之而来的 click，避免误选选项
  app.addEventListener('click',e=>{
    if(justSwiped){e.stopPropagation();e.preventDefault();}
  },true);
}

/* ---------- dialog ---------- */
function dialog(title,body,okText,onOk){
  const m=document.createElement('div');
  m.className='mask';
  m.innerHTML=`<div class="dlg" role="dialog" aria-modal="true">
    <h3>${esc(title)}</h3><p>${esc(body)}</p>
    <div class="dlg-btns">
      <button class="btn ghost" data-x="0">取消</button>
      <button class="btn primary" data-x="1" style="${okText==='清空'?'background:var(--no);box-shadow:none':''}">${esc(okText||'确定')}</button>
    </div></div>`;
  document.body.appendChild(m);
  m.onclick=e=>{
    const x=e.target.closest('[data-x]');
    if(x){m.remove();if(x.dataset.x==='1'&&onOk)onOk();}
    else if(e.target===m)m.remove();
  };
}

/* ============================================================
   BOOT
   ============================================================ */
function render(){
  route=parseHash();
  if(route==='quiz'){viewQuiz();return;}
  if(route==='wrong'){viewWrong();return;}
  if(route==='stats'){viewStats();return;}
  if(route==='more'){viewMore();return;}
  viewHome();
}

function bindHome(){
  document.addEventListener('click',e=>{
    const b=e.target.closest('[data-act],[data-part],[data-t],[data-f],[data-s]');
    if(!b)return;
    if(b.dataset.part!==undefined&&b.classList.contains('chap')){startSession('part',+b.dataset.part);return;}
    if(b.dataset.act){
      const a=b.dataset.act;
      if(a==='continue')resumeSession();
      else if(a==='seq'||a==='rand'||a==='exam'||a==='wrong')startSession(a);
      return;
    }
  });
  document.addEventListener('keydown',e=>{
    if(route!=='quiz'||!QS)return;
    const q=Q(QS.ids[QS.idx]);const no=q[0];const done=!!QS.done[no];
    if(e.key==='Enter'){
      if(done){e.preventDefault();if(QS.idx>=QS.ids.length-1)viewResult();else nextQ();}
      else if(isMulti(q))judge(q,QS.sel[no]||[]);
      return;
    }
    if(e.key==='ArrowLeft'&&QS.idx>0){QS.idx--;syncSession();renderQuiz();}
    if(e.key==='ArrowRight'){if(done){if(QS.idx>=QS.ids.length-1)viewResult();else nextQ();}}
    const n=parseInt(e.key);
    if(n>=1&&n<=q[4].length&&!done){
      const k=String.fromCharCode(64+n);
      if(isMulti(q)){
        const cur=new Set(QS.sel[no]||[]);cur.has(k)?cur.delete(k):cur.add(k);
        QS.sel[no]=[...cur].sort();renderQuiz();
      }else{QS.sel[no]=[k];judge(q,[k]);}
    }
  });
}

window.addEventListener('hashchange',render);
window.addEventListener('popstate',()=>{ if(location.hash)render(); });
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{if(S.prefs.theme==='auto')applyTheme();});

bindHome();bindBanks();bindSwipe();
applyTheme();applyFS();
if(!location.hash)history.replaceState(null,'','#/home');
render();
</script>
